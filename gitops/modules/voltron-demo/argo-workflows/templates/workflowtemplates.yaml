#
# WorkflowTemplates for module voltron-demo (Horizon catalog: exposed).
# Argo Events Sensors: templates/sensors.yaml.
#
# The image sources (Dockerfile and all assets) live in the internal Git-on-Borg
# repository sdv-demos and are cloned at run time; nothing is vendored here.
# Authentication uses a per-run gitcookies value supplied as a workflow parameter.
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .Values.parentModuleName }}-init
  namespace: {{ .Values.workflowNamespace }}
  labels:
    app.kubernetes.io/name: init
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: {{ .Values.parentModuleName }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  entrypoint: run-init
  serviceAccountName: {{ include "voltron-demo.workflowServiceAccountName" . }}
  archiveLogs: true
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflowDefaults.ttlStrategy.secondsAfterCompletion }}
    secondsAfterFailure: {{ .Values.workflowDefaults.ttlStrategy.secondsAfterFailure }}
  arguments:
    parameters:
      - name: horizonSubmittedFrom
        value: ""
        description: Populated by the Developer Portal / Horizon CLI. Leave empty.
      - name: gobGitcookiesB64
        value: ""
        description: >-
          Base64 of your raw ~/.gitcookies file, as a single line
          (`base64 -w0 ~/.gitcookies`). Grants read access to the internal
          sdv-demos repository. Personal and short lived: Git-on-Borg cookies
          expire after roughly 20 hours, so paste a fresh value each run.
          Argo has no masked-parameter support, so treat the value as visible
          to anyone who can read workflows in this namespace.
  templates:
    # Cheap preflight. Catches an expired cookie, an unreachable repository or a
    # missing revision in seconds, rather than after a multi-GB image build.
    - name: run-init
      container:
        image: {{ .Values.spec.gitImage }}
        command: [sh, -c]
        env:
          - name: GOB_GITCOOKIES_B64
            value: '{{ "{{" }}workflow.parameters.gobGitcookiesB64{{ "}}" }}'
          - name: SDV_DEMOS_REPO
            value: {{ .Values.spec.sdvDemosRepo | quote }}
          - name: SDV_DEMOS_REVISION
            value: {{ .Values.spec.sdvDemosRevision | quote }}
          - name: GIT_TERMINAL_PROMPT
            value: "0"
        args:
          - |
            set -eu

            if [ -z "${GOB_GITCOOKIES_B64}" ]; then
              echo "ERROR: gobGitcookiesB64 is empty."
              echo "Generate it locally with: base64 -w0 ~/.gitcookies"
              exit 1
            fi

            umask 077
            printf '%s' "${GOB_GITCOOKIES_B64}" | base64 -d > "${HOME}/.gitcookies"
            chmod 600 "${HOME}/.gitcookies"
            # Never echo the credential itself; a digest is enough to correlate runs.
            echo "gitcookies sha256: $(sha256sum "${HOME}/.gitcookies" | cut -d' ' -f1)"

            git config --global http.cookiefile "${HOME}/.gitcookies"
            git config --global --unset-all credential.helper 2>/dev/null || true
            # Large Git-on-Borg fetches are markedly more reliable over HTTP/1.1.
            git config --global http.version HTTP/1.1

            echo "Checking ${SDV_DEMOS_REPO} at revision ${SDV_DEMOS_REVISION}..."
            if ! LS_REMOTE=$(git ls-remote --heads "${SDV_DEMOS_REPO}" "${SDV_DEMOS_REVISION}" 2>&1); then
              echo "ERROR: could not reach ${SDV_DEMOS_REPO}."
              echo "The cookie may have expired, or it may not grant access to this repository."
              echo "${LS_REMOTE}"
              exit 1
            fi
            if [ -z "${LS_REMOTE}" ]; then
              echo "ERROR: revision '${SDV_DEMOS_REVISION}' does not exist on ${SDV_DEMOS_REPO}."
              exit 1
            fi
            echo "OK: ${LS_REMOTE}"

            # The shared build template derives the build context from the Dockerfile
            # directory, so the Dockerfile must sit at the repository root. Verify that
            # cheaply with a blobless clone rather than discovering it mid-build.
            WORKDIR=$(mktemp -d)
            git clone --quiet --depth 1 --filter=blob:none --no-checkout \
              --branch "${SDV_DEMOS_REVISION}" "${SDV_DEMOS_REPO}" "${WORKDIR}/repo"
            if git -C "${WORKDIR}/repo" ls-tree --name-only HEAD | grep -qx 'Dockerfile'; then
              echo "OK: Dockerfile present at the repository root."
            else
              echo "ERROR: no Dockerfile at the root of ${SDV_DEMOS_REPO}@${SDV_DEMOS_REVISION}."
              echo "common-docker-image-build requires the Dockerfile at the root of its build context."
              exit 1
            fi

            echo "Preflight passed."
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          memory: "512Mi"
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .Values.parentModuleName }}-execute
  namespace: {{ .Values.workflowNamespace }}
  labels:
    app.kubernetes.io/name: execute
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: {{ .Values.parentModuleName }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  entrypoint: run-execute
  # Remove the per-run credentials Secret whatever the outcome of the DAG.
  onExit: cleanup-gob-git-creds
  serviceAccountName: {{ include "voltron-demo.workflowServiceAccountName" . }}
  archiveLogs: true
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflowDefaults.ttlStrategy.secondsAfterCompletion }}
    secondsAfterFailure: {{ .Values.workflowDefaults.ttlStrategy.secondsAfterFailure }}
  arguments:
    parameters:
      - name: horizonSubmittedFrom
        value: ""
        description: Populated by the Developer Portal / Horizon CLI. Leave empty.
      - name: gobGitcookiesB64
        value: ""
        description: >-
          Base64 of your raw ~/.gitcookies file, as a single line
          (`base64 -w0 ~/.gitcookies`). Grants read access to the internal
          sdv-demos repository. Personal and short lived: Git-on-Borg cookies
          expire after roughly 20 hours, so paste a fresh value each run.
          Argo has no masked-parameter support, so treat the value as visible
          to anyone who can read workflows in this namespace.
  templates:
    - name: run-execute
      dag:
        tasks:
          - name: prepare-gob-git-creds
            template: prepare-gob-git-creds

          # Delegates to the shared ClusterWorkflowTemplate from module
          # workloads-common. It runs buildkit, which (unlike Kaniko) honours the
          # `# syntax=` directive and COPY --chmod used throughout the sdv-demos
          # Dockerfile.
          - name: build-image
            depends: prepare-gob-git-creds.Succeeded
            templateRef:
              name: {{ .Values.clusterWorkflowTemplateName | quote }}
              template: build
              clusterScope: true
            arguments:
              artifacts:
                - name: source
                  path: /workspace
                  git:
                    repo: {{ .Values.spec.sdvDemosRepo | quote }}
                    revision: {{ .Values.spec.sdvDemosRevision | quote }}
                    depth: 1
                    usernameSecret:
                      name: '{{ "{{" }}workflow.uid{{ "}}" }}-sdv-demos-git-creds'
                      key: username
                    passwordSecret:
                      name: '{{ "{{" }}workflow.uid{{ "}}" }}-sdv-demos-git-creds'
                      key: password
              parameters:
                - name: horizonSubmittedFrom
                  value: '{{ "{{" }}workflow.parameters.horizonSubmittedFrom{{ "}}" }}'
                - name: cloudProject
                  value: {{ .Values.gcpProjectId | quote }}
                - name: cloudRegion
                  value: {{ .Values.gcpRegion | quote }}
                - name: dockerArtifactPathName
                  value: {{ .Values.spec.dockerArtifactPathName | quote }}
                - name: imageTag
                  value: {{ .Values.spec.imageTag | quote }}
                # Dockerfile sits at the root of the cloned repository, which is
                # also the build context.
                - name: dockerfileDir
                  value: "."
                - name: buildArgs
                  value: "BASE_IMAGE={{ include "voltron-demo.asfpBaseImage" . }}"

          - name: build-snapshot
            depends: build-image.Succeeded
            template: run-build-snapshot
            arguments:
              parameters:
                - name: workstationCluster
                  value: {{ .Values.spec.workstationCluster | quote }}
                - name: builderConfig
                  value: {{ .Values.spec.builderConfig | quote }}

          - name: test-artifacts
            depends: build-snapshot.Succeeded
            template: run-test-artifacts
            arguments:
              parameters:
                - name: workstationCluster
                  value: {{ .Values.spec.workstationCluster | quote }}
                - name: testerConfig
                  value: 'tester-config-{{ "{{" }}workflow.uid{{ "}}" }}'
                - name: candidateSnapshotName
                  value: '{{ "{{" }}tasks.build-snapshot.outputs.parameters.candidateSnapshotName{{ "}}" }}'

          - name: promote-snapshot
            depends: test-artifacts.Succeeded
            template: run-promote-snapshot
            arguments:
              parameters:
                - name: candidateSnapshotName
                  value: '{{ "{{" }}tasks.build-snapshot.outputs.parameters.candidateSnapshotName{{ "}}" }}'

    # Turns the supplied gitcookies into the HTTP basic credentials that Argo's git
    # artifact understands. A .gitcookies line is tab separated and its 7th field is
    # `<username>=<token>`, which is exactly the pair *.googlesource.com expects.
    - name: prepare-gob-git-creds
      container:
        image: {{ .Values.spec.kubectlImage }}
        command: [sh, -c]
        env:
          - name: GOB_GITCOOKIES_B64
            value: '{{ "{{" }}workflow.parameters.gobGitcookiesB64{{ "}}" }}'
          - name: WORKFLOW_UID
            value: '{{ "{{" }}workflow.uid{{ "}}" }}'
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        args:
          - |
            set -eu

            if [ -z "${GOB_GITCOOKIES_B64}" ]; then
              echo "ERROR: gobGitcookiesB64 is empty."
              echo "Generate it locally with: base64 -w0 ~/.gitcookies"
              exit 1
            fi

            umask 077
            COOKIES=$(mktemp)
            trap 'rm -f "${COOKIES}"' EXIT
            printf '%s' "${GOB_GITCOOKIES_B64}" | base64 -d > "${COOKIES}"
            echo "gitcookies sha256: $(sha256sum "${COOKIES}" | cut -d' ' -f1)"

            # Netscape cookie format is tab separated; fall back to any whitespace.
            COOKIE_VALUE=$(awk -F'\t' '$1 ~ /googlesource\.com$/ { print $7; exit }' "${COOKIES}")
            if [ -z "${COOKIE_VALUE}" ]; then
              COOKIE_VALUE=$(awk '$1 ~ /googlesource\.com$/ { print $7; exit }' "${COOKIES}")
            fi
            if [ -z "${COOKIE_VALUE}" ]; then
              echo "ERROR: no *.googlesource.com entry found in the supplied gitcookies."
              exit 1
            fi

            GIT_USERNAME="${COOKIE_VALUE%%=*}"
            GIT_PASSWORD="${COOKIE_VALUE#*=}"
            if [ -z "${GIT_USERNAME}" ] || [ -z "${GIT_PASSWORD}" ] || \
               [ "${GIT_USERNAME}" = "${COOKIE_VALUE}" ]; then
              echo "ERROR: could not split the cookie into username and token."
              exit 1
            fi
            echo "Derived git username: ${GIT_USERNAME}"

            SECRET_NAME="${WORKFLOW_UID}-sdv-demos-git-creds"
            kubectl delete secret --ignore-not-found "${SECRET_NAME}" -n "${POD_NAMESPACE}"
            kubectl create secret generic "${SECRET_NAME}" -n "${POD_NAMESPACE}" \
              --from-literal=username="${GIT_USERNAME}" \
              --from-literal=password="${GIT_PASSWORD}"
            echo "Created Secret ${SECRET_NAME} in ${POD_NAMESPACE}."
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          memory: "256Mi"

    - name: cleanup-gob-git-creds
      container:
        image: {{ .Values.spec.kubectlImage }}
        command: [sh, -c]
        env:
          - name: WORKFLOW_UID
            value: '{{ "{{" }}workflow.uid{{ "}}" }}'
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        args:
          - |
            set -eu
            kubectl delete secret --ignore-not-found \
              "${WORKFLOW_UID}-sdv-demos-git-creds" -n "${POD_NAMESPACE}"
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          memory: "256Mi"

    - name: run-build-snapshot
      inputs:
        parameters:
          - name: workstationCluster
          - name: builderConfig
      outputs:
        parameters:
          - name: candidateSnapshotName
            valueFrom:
              path: /tmp/candidate_snapshot_name
      container:
        image: {{ .Values.spec.cloudSdkImage }}
        command: [sh, -c]
        args:
          - |
            set -eo pipefail
            PROJECT="{{ .Values.gcpProjectId }}"
            REGION="{{ .Values.gcpRegion }}"
            CLUSTER='{{ "{{" }}inputs.parameters.workstationCluster{{ "}}" }}'
            CONFIG='{{ "{{" }}inputs.parameters.builderConfig{{ "}}" }}'
            BUILD_WS="voltron-builder-{{ "{{" }}workflow.uid{{ "}}" }}"

            echo "Creating temporary builder workstation: ${BUILD_WS}..."
            gcloud workstations create "${BUILD_WS}" \
                --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" \
                --config="${CONFIG}"

            echo "Starting builder workstation..."
            gcloud workstations start "${BUILD_WS}" \
                --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" \
                --config="${CONFIG}"

            echo "Stopping builder to snapshot its persistent disk..."
            gcloud workstations stop "${BUILD_WS}" \
                --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" \
                --config="${CONFIG}" --quiet

            echo "Looking up persistent disk for ${BUILD_WS}..."
            SHORT_DISK_NAME=$(gcloud compute disks list \
                --project="${PROJECT}" \
                --filter="labels.workstation_id=${BUILD_WS}" \
                --format="value(name)" | head -n 1)

            if [ -z "${SHORT_DISK_NAME}" ]; then
              echo "Error: Could not find persistent disk for workstation ${BUILD_WS}"
              exit 1
            fi

            echo "Found PD: ${SHORT_DISK_NAME}"
            CANDIDATE_SNAP="voltron-pd-snap-{{ "{{" }}workflow.uid{{ "}}" }}"

            echo "Creating snapshot ${CANDIDATE_SNAP} from regional disk ${SHORT_DISK_NAME}..."
            gcloud compute snapshots create "${CANDIDATE_SNAP}" \
                --source-disk="${SHORT_DISK_NAME}" \
                --source-disk-region="${REGION}" \
                --project="${PROJECT}"

            echo "Cleaning up temporary builder workstation..."
            gcloud workstations delete "${BUILD_WS}" \
                --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" \
                --config="${CONFIG}" --quiet || true

            echo -n "${CANDIDATE_SNAP}" > /tmp/candidate_snapshot_name

    - name: run-test-artifacts
      inputs:
        parameters:
          - name: workstationCluster
          - name: testerConfig
          - name: candidateSnapshotName
      container:
        image: {{ .Values.spec.cloudSdkImage }}
        command: [sh, -c]
        args:
          - |
            set -eo pipefail
            PROJECT="{{ .Values.gcpProjectId }}"
            REGION="{{ .Values.gcpRegion }}"
            CLUSTER='{{ "{{" }}inputs.parameters.workstationCluster{{ "}}" }}'
            CONFIG='{{ "{{" }}inputs.parameters.testerConfig{{ "}}" }}'
            TEST_WS="voltron-tester-{{ "{{" }}workflow.uid{{ "}}" }}"

            echo "We need to create the temporary tester config matching the candidate snapshot..."
            gcloud workstations configs create "${CONFIG}" \
                --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" \
                --machine-type="n1-standard-16" \
                --accelerator-type="nvidia-tesla-t4" \
                --accelerator-count=1 \
                --container-custom-image="{{ include "voltron-demo.outputImage" . }}" \
                --pd-disk-type="pd-ssd" \
                --pd-source-snapshot="projects/${PROJECT}/global/snapshots/{{ "{{" }}inputs.parameters.candidateSnapshotName{{ "}}" }}"

            cleanup() {
              echo "Cleaning up test workstation and config..."
              gcloud workstations delete "${TEST_WS}" --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" --config="${CONFIG}" --quiet || true
              gcloud workstations configs delete "${CONFIG}" --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" --quiet || true
            }
            trap cleanup EXIT

            echo "Creating temporary test workstation: ${TEST_WS}..."
            gcloud workstations create "${TEST_WS}" --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" --config="${CONFIG}"

            echo "Starting test workstation..."
            STARTED=false
            for attempt in 1 2 3; do
              if gcloud workstations start "${TEST_WS}" --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" --config="${CONFIG}"; then
                STARTED=true
                break
              fi
              echo "Retrying workstation start in 15s (attempt $attempt/3)..."
              sleep 15
            done
            if [ "$STARTED" != "true" ]; then
              echo "Failed to start test workstation after 3 attempts."
              exit 1
            fi

            echo "Running automated verification tests via workstation ssh..."
            gcloud workstations ssh "${TEST_WS}" \
                --project="${PROJECT}" --region="${REGION}" --cluster="${CLUSTER}" --config="${CONFIG}" \
                --quiet \
                --command="bash -ic 'echo Testing CARLA... && nohup \${HOME}/Workspace/carla-installation/CarlaUE4.sh -RenderOffScreen -nosound -carla-server -carla-rpc-port=2000 > /tmp/carla.log 2>&1 & sleep 10 && ss -tulpn | grep 2000 && pkill -9 -f CarlaUE4 && echo CARLA OK && echo Testing launch_2vm... && launch_2vm && clear_2vm && echo All tests passed!'"

            echo "Artifacts verified successfully!"

    - name: run-promote-snapshot
      inputs:
        parameters:
          - name: candidateSnapshotName
      container:
        image: {{ .Values.spec.cloudSdkImage }}
        command: [sh, -c]
        args:
          - |
            set -eo pipefail
            PROJECT="{{ .Values.gcpProjectId }}"
            CANDIDATE_SNAP='{{ "{{" }}inputs.parameters.candidateSnapshotName{{ "}}" }}'

            OLD_LATEST=$(gcloud compute snapshots list --project="${PROJECT}" --filter="labels.is-latest=true" --format="value(name)" 2>/dev/null || true)
            for old_snap in ${OLD_LATEST}; do
              gcloud compute snapshots remove-labels "${old_snap}" --labels="is-latest" --project="${PROJECT}" 2>/dev/null || true
            done
            gcloud compute snapshots add-labels "${CANDIDATE_SNAP}" --labels="is-latest=true,env=production" --project="${PROJECT}"
