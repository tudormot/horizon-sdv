apiVersion: v1
kind: ConfigMap
metadata:
  name: horizon-router-config
  namespace: horizon
  labels:
    app.kubernetes.io/name: horizon-router
    app.kubernetes.io/part-of: sdv-horizon
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      client_max_body_size 100M;

      resolver kube-dns.kube-system.svc.cluster.local valid=10s;

      # Extract port from incoming Host header
      map $http_host $forwarded_port {
        default $server_port;
        "~^.*:(?<p>\d+)$" $p;
      }

      # Virtual Host: dev.horizon-sdv.com (HTTP & HTTPS)
      server {
        listen 80 default_server;
        listen 8080 default_server;
        listen 443 ssl default_server;
        server_name dev.horizon-sdv.com localhost _;

        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;

        # Rewrite upstream cookies to be HTTP-compatible
        proxy_cookie_flags ~ samesite=lax nosecure;

        # Horizon Developer Portal (SPA)
        location /developer-portal {
          proxy_pass http://horizon-dev-portal.horizon-dev-portal.svc.cluster.local:80/;
        }

        # Keycloak IAM & SSO
        location /auth {
          proxy_pass http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080;
        }

        # Jenkins CI
        location /jenkins {
          proxy_pass http://jenkins.jenkins.svc.cluster.local:8080;
        }

        # Gerrit Code Review
        location /gerrit {
          proxy_pass http://gerrit-service.gerrit.svc.cluster.local:8080;
        }

        # Argo CD
        location /argocd {
          proxy_pass http://argocd-server.argocd.svc.cluster.local:80;
        }

        # Grafana Monitoring
        location /grafana {
          proxy_pass http://grafana.monitoring.svc.cluster.local:80;
        }

        # Headlamp K8s UI
        location /headlamp {
          proxy_pass http://headlamp.headlamp.svc.cluster.local:80;
        }

        # Argo Workflows
        location /workflows {
          proxy_pass http://argo-workflows-server.argo-workflows.svc.cluster.local:2746;
        }

        # Horizon API
        location /horizon-api/ {
          proxy_pass http://horizon-api.horizon-api.svc.cluster.local:80/;
        }
        location /api/ {
          proxy_pass http://horizon-api.horizon-api.svc.cluster.local:80/;
        }

        # MTK Connect
        location /mtk-connect/devices/ws {
          proxy_pass http://mtk-connect-websockets.mtk-connect.svc.cluster.local:8086/;
        }
        location /mtk-connect/ws {
          proxy_pass http://mtk-connect-wamprouter.mtk-connect.svc.cluster.local:8080/ws;
        }
        location /mtk-connect/saml {
          proxy_pass http://mtk-connect-router.mtk-connect.svc.cluster.local:8082/saml;
        }
        location /mtk-connect/ {
          proxy_pass http://mtk-connect-router.mtk-connect.svc.cluster.local:8081/;
        }
        location /mtk-connect {
          return 301 /mtk-connect/;
        }

        # Landing Page (Default Root)
        location / {
          proxy_pass http://landingpage.horizon.svc.cluster.local:80;
        }
      }

      # Virtual Host: mcp.dev.horizon-sdv.com (HTTP & HTTPS)
      server {
        listen 80;
        listen 8080;
        listen 443 ssl;
        server_name mcp.dev.horizon-sdv.com;

        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;

        proxy_cookie_flags ~ samesite=lax nosecure;

        location /auth-server {
          proxy_pass http://auth-server.mcp-gateway-registry.svc.cluster.local:8888/;
        }

        location / {
          proxy_pass http://registry.mcp-gateway-registry.svc.cluster.local:80/;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-router
  namespace: horizon
  labels:
    app.kubernetes.io/name: horizon-router
    app.kubernetes.io/part-of: sdv-horizon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-router
    spec:
      containers:
        - name: nginx
          image: cgr.dev/chainguard/nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 8080
              name: http-alt
            - containerPort: 443
              name: https
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: ssl
              mountPath: /etc/nginx/ssl
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: horizon-router-config
        - name: ssl
          secret:
            secretName: horizon-router-tls
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-router
  namespace: horizon
  labels:
    app.kubernetes.io/name: horizon-router
    app.kubernetes.io/part-of: sdv-horizon
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 8080
      targetPort: 8080
      name: http-alt
    - port: 443
      targetPort: 443
      name: https
  selector:
    app.kubernetes.io/name: horizon-router
