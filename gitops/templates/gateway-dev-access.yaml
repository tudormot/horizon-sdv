{{- if and .Values.config.ingress.internal .Values.config.ingress.devAccess.enabled .Values.config.ingress.address }}
# Developer access relay (internal ingress only, opt-in).
#
# The regional internal Application Load Balancer VIP lives in the VPC and is not
# reachable from a workstation. `kubectl port-forward` can only target a Pod, so this
# minimal TCP relay gives the private VIP a Pod to forward to:
#
#   workstation --(kubectl port-forward)--> relay Pod --> Gateway VIP --> platform
#
# It is disabled by default and is not required by the platform itself; see
# tools/scripts/deployment/dev-access.sh. Prefer a bastion VM with IAP TCP
# forwarding if you need access that does not depend on the Kubernetes API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.namespacePrefix }}gateway-dev-access
  namespace: {{ .Values.config.namespacePrefix }}gke-gateway
  labels:
    app.kubernetes.io/name: gateway-dev-access
    app.kubernetes.io/component: developer-access
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-dev-access
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-dev-access
        app.kubernetes.io/component: developer-access
    spec:
      # Pod networking is sufficient to reach the internal ALB VIP; host networking
      # would occupy a node port and is not needed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: socat
        image: alpine/socat:1.8.0.0
        args:
        - "-d"
        - "TCP-LISTEN:8080,fork,reuseaddr"
        - "TCP:{{ .Values.config.ingress.address }}:80"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.namespacePrefix }}gateway-dev-access
  namespace: {{ .Values.config.namespacePrefix }}gke-gateway
  labels:
    app.kubernetes.io/name: gateway-dev-access
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway-dev-access
  ports:
  - name: http
    port: 80
    targetPort: http
{{- end }}
