apiVersion: v1
kind: ConfigMap
metadata:
  name: horizon-workflow-test-scripts
data:
  test_artifacts.py: |
    import os
    import sys
    import paramiko
    import time

    def run_ssh_command(ssh, command):
        stdin, stdout, stderr = ssh.exec_command(command)
        exit_status = stdout.channel.recv_exit_status()
        out = stdout.read().decode('utf-8')
        err = stderr.read().decode('utf-8')
        return exit_status, out, err

    def test_workstation():
        host = os.environ.get("WORKSTATION_FQDN")
        user = os.environ.get("WORKSTATION_USER", "user")
        key_path = os.environ.get("SSH_KEY_PATH")

        if not host:
            print("ERROR: WORKSTATION_FQDN environment variable not set.")
            sys.exit(1)
        
        print(f"Connecting to {host} as {user}...")
        
        ssh = paramiko.SSHClient()
        ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
        
        connected = False
        for i in range(30):
            try:
                ssh.connect(host, username=user, key_filename=key_path, timeout=5)
                connected = True
                print("SSH connected successfully!")
                break
            except Exception as e:
                print(f"Waiting for SSH on {host}... ({e})")
                time.sleep(5)
                
        if not connected:
            print(f"ERROR: Failed to connect to {host} after 30 attempts")
            sys.exit(1)
            
        print("Test 1: Launching CARLA Simulator via Workstation Wrapper")
        exit_status, out, err = run_ssh_command(ssh, "nohup ${HOME}/Workspace/carla-installation/CarlaUE4.sh -RenderOffScreen -nosound -carla-server -carla-rpc-port=2000 > /dev/null 2>&1 &")
        if exit_status != 0:
            print("Failed to launch CARLA")
            sys.exit(1)
            
        print("Wait up to 30s for port 2000 to open")
        port_open = False
        for i in range(30):
            status, out, err = run_ssh_command(ssh, "ss -tulpn | grep ':2000'")
            if ":2000" in out:
                port_open = True
                print("Port 2000 is listening!")
                break
            time.sleep(1)
            
        run_ssh_command(ssh, "pkill -9 -f CarlaUE4")
        if not port_open:
            print("ERROR: CARLA did not open port 2000 in time.")
            sys.exit(1)

        print("Test 2: launch_2vm execution")
        status, out, err = run_ssh_command(ssh, "bash -ic 'launch_2vm'")
        print(f"launch_2vm output: {out}")
        run_ssh_command(ssh, "bash -ic 'clear_2vm'")
        
        if status != 0:
            print("ERROR: launch_2vm failed.")
            sys.exit(1)
            
        print("All tests passed successfully.")
        ssh.close()
        sys.exit(0)

    if __name__ == "__main__":
        test_workstation()
